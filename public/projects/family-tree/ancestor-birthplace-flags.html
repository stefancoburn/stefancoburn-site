<div id="tip"></div>
<script>
const tip=document.getElementById('tip');
document.querySelectorAll('.cell').forEach(c=>{
  c.addEventListener('mousemove',e=>{tip.textContent=c.dataset.tip;tip.style.opacity=1;
    tip.style.left=Math.min(e.clientX+14,window.innerWidth-290)+'px';tip.style.top=(e.clientY+16)+'px';});
  c.addEventListener('mouseleave',()=>tip.style.opacity=0);
});
document.getElementById('dl').addEventListener('click',()=>{
  const svg=document.getElementById('fan');
  const xml=new XMLSerializer().serializeToString(svg);
  const img=new Image();
  img.onload=()=>{
    const s=2, vb=svg.viewBox.baseVal;
    const cv=document.createElement('canvas');cv.width=vb.width*s;cv.height=vb.height*s;
    const ctx=cv.getContext('2d');ctx.scale(s,s);ctx.drawImage(img,0,0,vb.width,vb.height);
    const a=document.createElement('a');a.download='ancestor-birthplace-flags.png';a.href=cv.toDataURL('image/png');a.click();
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
});
</script>
